<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuminaAvatar Project Home</title>
  <style>
    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      max-width: 500px;
    }
    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 0;
      margin-bottom: 12px;
    }
    p {
      color: #9ca3af;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      font-size: 1.05rem;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.6);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>LuminaAvatar</h1>
    <p>Welcome to the LuminaAvatar development server. The interactive demo and test environment is located in the demo directory.</p>
    <a href="/demo/index.html" class="btn">Launch Live Demo</a>
  </div>
</body>
</html>
